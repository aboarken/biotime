COM_BIOTIME="ZKBioTime"
COM_BIOTIME_XML_DESCRIPTION="Read-only employee self-service attendance portal for ZKTeco ZKBioTime 9.5. ZKBioTime stays the single source of truth; Joomla only reads and displays."
COM_BIOTIME_SUBMENU_SETTINGS="Integration Settings"
COM_BIOTIME_SUBMENU_MAPPINGS="User Mappings"
COM_BIOTIME_SUBMENU_ENDPOINTS="Find Endpoints"

COM_BIOTIME_INSTALL_MIN_PHP="ZKBioTime needs PHP %s or later. Please ask your hosting provider to upgrade PHP."
COM_BIOTIME_INSTALL_MIN_JOOMLA="ZKBioTime needs Joomla %s or later. Please update Joomla first."
COM_BIOTIME_INSTALL_NO_OPENSSL="ZKBioTime needs the PHP OpenSSL extension with AES-256-GCM to encrypt the API password. Please ask your hosting provider to enable it."
COM_BIOTIME_INSTALL_CLEANED_FILES="%d files or folders of removed features were deleted."
COM_BIOTIME_INSTALL_TRASHED_MENU="%d menu items pointing to removed ZKBioTime pages were moved to the trash."
COM_BIOTIME_INSTALL_NEXT_STEPS="ZKBioTime is installed. Next: open Components → ZKBioTime → Integration Settings, enter the server and API user, and click Test Connection."

COM_BIOTIME_ACCESS_DASHBOARD_VIEW="View My Dashboard"
COM_BIOTIME_ACCESS_DASHBOARD_VIEW_DESC="Allows users in the group to open My Dashboard (their own attendance only)."
COM_BIOTIME_ACCESS_ATTENDANCE_VIEW="View My Attendance"
COM_BIOTIME_ACCESS_ATTENDANCE_VIEW_DESC="Allows users in the group to open My Attendance (their own check-in and check-out times only)."
COM_BIOTIME_ACCESS_CALENDAR_VIEW="View Attendance Calendar"
COM_BIOTIME_ACCESS_CALENDAR_VIEW_DESC="Allows users in the group to open the Attendance Calendar (their own attendance only)."
COM_BIOTIME_ACCESS_DEVICES_VIEW="View Biometric Devices"
COM_BIOTIME_ACCESS_DEVICES_VIEW_DESC="Allows users in the group to open Biometric Devices: every ZKBioTime device with its name, location and health. Grant it to the groups that look after the devices (for example IT staff); it shows no employee data."

; Menu item types (Menus → Add New Menu Item → ZKBioTime)
COM_BIOTIME_MENU_DASHBOARD="My Dashboard"
COM_BIOTIME_MENU_DASHBOARD_DESC="Today's check-in and check-out, the month's present, absent and incomplete days, average times and recent attendance of the logged-in employee."
COM_BIOTIME_MENU_ATTENDANCE="My Attendance"
COM_BIOTIME_MENU_ATTENDANCE_DESC="One row per day: check-in, check-out, the time between them, the devices used and the day's status (Present, Absent, Incomplete, Weekend)."
COM_BIOTIME_MENU_CALENDAR="Attendance Calendar"
COM_BIOTIME_MENU_CALENDAR_DESC="Monthly calendar with each day's check-in, check-out and status."
COM_BIOTIME_MENU_DEVICES="Biometric Devices"
COM_BIOTIME_MENU_DEVICES_DESC="Every ZKBioTime biometric device with its name, location (area) and health (online, delayed, offline), last activity and the number of users and punches stored."
COM_BIOTIME_MENU_DEVICES_TECHNICAL="Show technical details"
COM_BIOTIME_MENU_DEVICES_TECHNICAL_DESC="Also show each device's serial number, IP address and firmware version. Show them only to the people who look after the devices."
