; Integration Settings: employee mapping, modules, data sources, system
COM_BIOTIME_SETTINGS_FIELDSET_MAPPING="Employee Mapping"
COM_BIOTIME_SETTINGS_MATCH_FIELD="Employee code user field"
COM_BIOTIME_SETTINGS_MATCH_FIELD_DESC="Name of the Joomla custom user field (Users → Fields) that holds each user's ZKBioTime employee code (emp_code), e.g. employeeid. Users are matched by it first. IMPORTANT: users must not be able to edit this field themselves (set the field's Editable In / permissions so only administrators can change it); otherwise a user could enter a colleague's code. When the field changes, the mapping is suspended until an administrator confirms it. Empty = not used."
COM_BIOTIME_SETTINGS_AUTO_MATCH="Match by e-mail when the field is empty"
COM_BIOTIME_SETTINGS_AUTO_MATCH_DESC="On a user's first visit, map them to the one ZKBioTime employee with exactly the same e-mail address (case-insensitive). Several or no matches leave the user unmatched for an administrator to map by employee code. Not used when the user's employee code field is filled in."
COM_BIOTIME_SETTINGS_ERR_MATCH_FIELD="The employee code user field must be a Joomla field name: lower-case letters, digits, - and _."

COM_BIOTIME_SETTINGS_FIELDSET_MODULES="Modules"
COM_BIOTIME_SETTINGS_MODULE_CHARTS="Charts"
COM_BIOTIME_SETTINGS_MODULE_CHARTS_DESC="Show the Monthly Overview chart on My Dashboard (the figures are always also shown as a table)."
COM_BIOTIME_SETTINGS_MODULE_EXPORTS="Exports"
COM_BIOTIME_SETTINGS_MODULE_EXPORTS_DESC="Allow PDF and Excel downloads on Attendance Reports (also needs the Export Attendance Reports permission)."
COM_BIOTIME_SETTINGS_MODULE_LEAVE="Leave information"
COM_BIOTIME_SETTINGS_MODULE_LEAVE_DESC="Show leave from the leave source below on the Calendar, day details and Reports."

COM_BIOTIME_SETTINGS_FIELDSET_DAILY="Daily Attendance Source"
COM_BIOTIME_SETTINGS_FIELDSET_DAILY_HELP="Where ZKBioTime's calculated attendance and the schedule applied on each date are read: a read-only API endpoint, or a saved ZKBioTime report, listed on your server's /api/docs/ page. Until this is set, schedules, statuses, late-in, early-out, worked hours and overtime show —; nothing is calculated by Joomla. The portal always adds the employee filter and the month's dates itself, and drops rows of other employees. See docs/API-MAPPING.md."
COM_BIOTIME_SETTINGS_FIELDSET_LEAVE="Leave Source"
COM_BIOTIME_SETTINGS_FIELDSET_LEAVE_HELP="Where leave records (approved, pending, rejected) are read, if your ZKBioTime offers them in its API. Empty = no leave information."
COM_BIOTIME_SETTINGS_SOURCE_PATH="API path"
COM_BIOTIME_SETTINGS_SOURCE_PATH_DESC="Path of the read-only list endpoint on the ZKBioTime server, starting and ending with /, exactly as on /api/docs/. Empty = not used."
COM_BIOTIME_SETTINGS_SOURCE_PARAM_EMP="Employee parameter"
COM_BIOTIME_SETTINGS_SOURCE_PARAM_FROM="Start date parameter"
COM_BIOTIME_SETTINGS_SOURCE_PARAM_TO="End date parameter"
COM_BIOTIME_SETTINGS_SOURCE_PARAM_DESC="Name of the query parameter, as on /api/docs/ (lower-case letters, digits, _). The portal fills in the logged-in employee's code and the dates."
COM_BIOTIME_SETTINGS_SOURCE_DATE_FORMAT="Date format of the parameters"
COM_BIOTIME_SETTINGS_SOURCE_DATE_FORMAT_DESC="How the start and end dates are sent."
COM_BIOTIME_SETTINGS_SOURCE_EXTRA="Fixed parameters"
COM_BIOTIME_SETTINGS_SOURCE_EXTRA_DESC="Optional, one per line as name = value, e.g. the id of a saved report. Values: letters, digits and . _ : , - only. No queries or SQL."
COM_BIOTIME_SETTINGS_SOURCE_FIELDS="Field names"
COM_BIOTIME_SETTINGS_DAILY_FIELDS_DESC="One per line: portal field = ZKBioTime field (use dots for nested fields, e.g. employee.emp_code). Required: emp_code, date. Optional: schedule, sched_start, sched_end, break, schedule_note, check_in, check_out, late, early, worked, overtime, status, leave. Fields left out show —."
COM_BIOTIME_SETTINGS_LEAVE_FIELDS_DESC="One per line: portal field = ZKBioTime field. Required: emp_code, start. Optional: end, type, duration, status."
COM_BIOTIME_SETTINGS_SOURCE_UNIT="Unit of durations"
COM_BIOTIME_SETTINGS_SOURCE_UNIT_DESC="Unit of numeric durations (late, early, worked, overtime, leave duration). Values like 08:30 are always read as hours:minutes."
COM_BIOTIME_SETTINGS_UNIT_MINUTES="Minutes"
COM_BIOTIME_SETTINGS_UNIT_HOURS="Hours"
COM_BIOTIME_SETTINGS_UNIT_SECONDS="Seconds"
COM_BIOTIME_SETTINGS_SOURCE_STATUS_MAP="Status names"
COM_BIOTIME_SETTINGS_DAILY_STATUS_MAP_DESC="One per line: ZKBioTime status text = present, late, early, absent, leave, holiday, rest, incomplete or other. Decides the colour and label; statuses not listed are shown with ZKBioTime's own text as Other."
COM_BIOTIME_SETTINGS_LEAVE_STATUS_MAP_DESC="One per line: ZKBioTime approval text = approved, pending or rejected."
COM_BIOTIME_SETTINGS_DAILY_ERR_PATH="Daily attendance source: the API path must look like /…/…/ (letters, digits, - and _ only), and cannot be a login path."
COM_BIOTIME_SETTINGS_DAILY_ERR_PARAM="Daily attendance source: parameter names may only use lower-case letters, digits and _."
