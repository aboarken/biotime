COM_BIOTIME_SETTINGS_HINT_ENV_SECRET="Recommended: set the web server environment variable <code>%1$s</code> to a random value of at least %2$d characters. Secrets are then encrypted with it instead of Joomla's configuration secret. After changing it, enter the API password (or token) again."
