COM_BIOTIME_SETTINGS_SERVER_URL="Server URL"
COM_BIOTIME_SETTINGS_SERVER_URL_DESC="Address of the ZKBioTime server as opened in a browser, e.g. https://biotime.example.com. No /api/ path, query or credentials."
COM_BIOTIME_SETTINGS_SERVER_PORT="Port"
COM_BIOTIME_SETTINGS_SERVER_PORT_DESC="Leave empty to use the port in the URL, or 443 (https) / 80 (http). ZKBioTime often runs on 8081."
COM_BIOTIME_SETTINGS_CONNECT_TIMEOUT="Connection timeout (seconds)"
COM_BIOTIME_SETTINGS_CONNECT_TIMEOUT_DESC="How long to wait for the connection to open (1–60). Must not exceed the total timeout."
COM_BIOTIME_SETTINGS_TIMEOUT="Total timeout (seconds)"
COM_BIOTIME_SETTINGS_TIMEOUT_DESC="How long one API call may take in total (1–300)."
COM_BIOTIME_SETTINGS_METHOD="Authentication method"
COM_BIOTIME_SETTINGS_METHOD_DESC="JWT: the API user's name and password are exchanged for a short-lived token that is renewed automatically. General Auth Token: enter a token, or let the component obtain one with the API user's name and password."
COM_BIOTIME_SETTINGS_METHOD_JWT="JWT"
COM_BIOTIME_SETTINGS_METHOD_TOKEN="General Auth Token"
COM_BIOTIME_SETTINGS_USERNAME="API username"
COM_BIOTIME_SETTINGS_USERNAME_DESC="A ZKBioTime user created for this portal, with read permission for personnel and attendance only."
COM_BIOTIME_SETTINGS_PASSWORD="API password"
COM_BIOTIME_SETTINGS_PASSWORD_DESC="Encrypted before it is stored and never shown again. Leave empty to keep the stored password."
COM_BIOTIME_SETTINGS_CLEAR_PASSWORD="Remove stored password"
COM_BIOTIME_SETTINGS_CLEAR_PASSWORD_DESC="Delete the stored API password when saving."
COM_BIOTIME_SETTINGS_TOKEN="General Auth Token"
COM_BIOTIME_SETTINGS_TOKEN_DESC="Optional. A token issued by ZKBioTime. Encrypted before it is stored and never shown again. A token entered here cannot be renewed by the component; leave it empty to obtain tokens with the username and password."
COM_BIOTIME_SETTINGS_CLEAR_TOKEN="Remove stored token"
COM_BIOTIME_SETTINGS_CLEAR_TOKEN_DESC="Delete the stored General Auth Token when saving."
COM_BIOTIME_SETTINGS_VERIFY_TLS="Verify TLS certificate"
COM_BIOTIME_SETTINGS_VERIFY_TLS_DESC="Keep this on. Turn it off only for a test server, or use a certificate pin instead."
COM_BIOTIME_SETTINGS_CA_BUNDLE="CA bundle file"
COM_BIOTIME_SETTINGS_CA_BUNDLE_DESC="Optional full path on this web server to a PEM file with the certificate authority that signed the ZKBioTime certificate (e.g. a company CA)."
COM_BIOTIME_SETTINGS_TLS_PIN="Certificate pin (SPKI)"
COM_BIOTIME_SETTINGS_TLS_PIN_DESC="Optional. sha256//... of the server's public key; several separated by ;. Identifies the server even by IP address or with a self-signed certificate. Use Read Certificate Pin, and compare the value with one computed on the ZKBioTime server itself before saving it."
COM_BIOTIME_SETTINGS_DETAILED_LOG="Detailed logging"
COM_BIOTIME_SETTINGS_DETAILED_LOG_DESC="Yes: administrator/logs/com_biotime.php also records each API call and what each page read and hid. No: only warnings and errors. Credentials, tokens and personal data are never logged."
COM_BIOTIME_SETTINGS_PAGE_SIZE="API page size"
COM_BIOTIME_SETTINGS_PAGE_SIZE_DESC="Rows requested per API page (1–1000, default 100)."
COM_BIOTIME_SETTINGS_MAX_PAGES="Safety maximum (pages)"
COM_BIOTIME_SETTINGS_MAX_PAGES_DESC="At most this many pages are read for one list (1–1000, default 50). When it is reached, pages say that results were cut off."

COM_BIOTIME_SETTINGS_ERR_URL_REQUIRED="Enter the ZKBioTime server URL."
COM_BIOTIME_SETTINGS_ERR_URL="The server URL must be an http or https address without a query, fragment or credentials, e.g. https://biotime.example.com."
COM_BIOTIME_SETTINGS_ERR_PORT="The port must be a number from 1 to 65535, and the same as any port in the URL."
COM_BIOTIME_SETTINGS_ERR_METHOD="Choose JWT or General Auth Token."
COM_BIOTIME_SETTINGS_ERR_USERNAME="The API username may have at most 150 characters and no control characters."
COM_BIOTIME_SETTINGS_ERR_PASSWORD="The API password may have at most 256 characters and no control characters."
COM_BIOTIME_SETTINGS_ERR_TOKEN="The General Auth Token does not look like a ZKBioTime token (16 or more letters, digits or . _ - + / = ~)."
COM_BIOTIME_SETTINGS_ERR_JWT_CREDENTIALS="JWT needs an API username and password."
COM_BIOTIME_SETTINGS_ERR_TOKEN_CREDENTIALS="General Auth Token needs a token, or an API username and password."
COM_BIOTIME_SETTINGS_ERR_TIMEOUT_RANGE="The connection timeout must be 1–60 seconds and the total timeout 1–300 seconds."
COM_BIOTIME_SETTINGS_ERR_TIMEOUTS="The connection timeout must not be longer than the total timeout."
COM_BIOTIME_SETTINGS_ERR_CA_BUNDLE="The CA bundle file does not exist or cannot be read by the web server."
COM_BIOTIME_SETTINGS_ERR_PIN="The certificate pin must look like sha256//&lt;44 base64 characters&gt;, at most 5, separated by ;."
COM_BIOTIME_SETTINGS_ERR_PIN_HTTPS="A certificate pin needs an https server URL."
COM_BIOTIME_SETTINGS_ERR_PAGE_SIZE="The API page size must be 1–1000."
COM_BIOTIME_SETTINGS_ERR_MAX_PAGES="The safety maximum must be 1–1000 pages."
COM_BIOTIME_SETTINGS_ERR_NO_SECRET="No encryption secret is available, so the password or token cannot be stored. Set the environment variable BIOTIME_PORTAL_SECRET or check Joomla's configuration secret."

